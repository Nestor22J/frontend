<nav class="navbar navbar-expand-lg navbar-dark bg-navy shadow-sm py-3">
  <div class="container">
    
    <a class="navbar-brand d-flex align-items-center fw-bold text-white fs-4" routerLink="/dashboard">
      <i class="bi bi-houses-fill text-warning me-2 fs-3"></i>
      <span>Inkapolis</span>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      
      <!-- Center items -->
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-semibold" *ngIf="usuario()">
        <!-- Admin & Agent Nav Links -->
        <ng-container *ngIf="authService.esAdmin() || authService.esAgente()">
          <li class="nav-item px-2">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
          </li>
          <li class="nav-item px-2">
            <a class="nav-link" routerLink="/propiedades" routerLinkActive="active"><i class="bi bi-map me-1"></i> Lotes y Mapa</a>
          </li>
          <li class="nav-item px-2">
            <a class="nav-link" routerLink="/citas" routerLinkActive="active"><i class="bi bi-calendar-event me-1"></i> Citas / Visitas</a>
          </li>
          <li class="nav-item px-2">
            <a class="nav-link" routerLink="/contratos" routerLinkActive="active"><i class="bi bi-file-earmark-text me-1"></i> Contratos</a>
          </li>
        </ng-container>

        <!-- Client Nav Links -->
        <ng-container *ngIf="authService.esCliente()">
          <li class="nav-item px-2">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active"><i class="bi bi-person-workspace me-1"></i> Mi Panel</a>
          </li>
          <li class="nav-item px-2">
            <a class="nav-link" routerLink="/propiedades" routerLinkActive="active"><i class="bi bi-map me-1"></i> Plano de Lotes</a>
          </li>
          <li class="nav-item px-2">
            <a class="nav-link" routerLink="/citas" routerLinkActive="active"><i class="bi bi-calendar-check me-1"></i> Mis Citas</a>
          </li>
          <li class="nav-item px-2">
            <a class="nav-link" routerLink="/contratos" routerLinkActive="active"><i class="bi bi-file-text me-1"></i> Mis Contratos</a>
          </li>
          <li class="nav-item px-2">
            <a class="nav-link" routerLink="/perfil" routerLinkActive="active"><i class="bi bi-person-gear me-1"></i> Mi Perfil</a>
          </li>
        </ng-container>
      </ul>

      <!-- Right items -->
      <div class="d-flex align-items-center ms-auto gap-2" *ngIf="usuario(); else anonView">
        <div class="me-1 text-end d-none d-sm-block text-white">
          <div class="small fw-bold">{{ usuario()?.nombre }}</div>
          <span class="badge rounded-pill bg-warning text-dark text-uppercase small-badge">{{ usuario()?.rol }}</span>
        </div>
        <a *ngIf="authService.esCliente()" routerLink="/perfil" class="btn btn-outline-light-50 btn-sm rounded-pill px-3 fw-semibold border-0 text-white-50" title="Mi Perfil">
          <i class="bi bi-person-gear"></i>
        </a>
        <button class="btn btn-outline-light-50 btn-sm rounded-pill px-3 fw-semibold border-0 text-white-50 hover-light" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i> Salir
        </button>
      </div>

      <ng-template #anonView>
        <div class="ms-auto">
          <a routerLink="/login" class="btn btn-warning btn-sm rounded-pill px-4 fw-semibold text-dark"><i class="bi bi-person-fill me-1"></i> Iniciar Sesión</a>
        </div>
      </ng-template>

    </div>
  </div>
</nav>
